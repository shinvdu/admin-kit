name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Test workspace
        run: cargo test --workspace
      - name: Build Lambda binary
        run: cargo build --release --target x86_64-unknown-linux-musl -p admin-kit-api

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      - name: Typecheck
        run: corepack pnpm typecheck
      - name: Lint (check only)
        run: corepack pnpm exec eslint .
      - name: Build
        run: corepack pnpm build
      - name: Check production bundle for demo/mock leftovers
        run: |
          if grep -RInE 'apifox|mock\.apifox|SoybeanAdmin|123456' dist; then
            echo "Unexpected demo/mock content in dist" >&2
            exit 1
          fi